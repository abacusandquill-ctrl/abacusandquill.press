<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abacus & Quill</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0e0e0e;
      color: #e8e0d0;
      font-family: Georgia, serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .container {
      max-width: 520px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: normal;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #b0a898;
    }

    .contact {
      position: fixed;
      top: 2rem;
      right: 2rem;
      text-align: right;
    }

    .contact button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .contact img {
      width: 64px;
      height: auto;
      display: block;
    }

    .email {
      display: none;
      margin-top: 0.7rem;
      font-size: 0.85rem;
    }

    .email.visible {
      display: block;
    }

    .email a {
      color: #b0a898;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="contact">
    <button id="contactButton" aria-label="Contact Abacus & Quill">
      <img src="aq-logo.png" alt="A&Q">
    </button>

    <div class="email" id="email">
      <a href="mailto:hello@abacusandquill.press">
        hello@abacusandquill.press
      </a>
    </div>
  </div>

  <div class="container">
    <h1>Abacus &amp; Quill</h1>
    <p>
      New stories that feel remembered.<br>
      Beautiful books for curious young readers —<br>
      and for those who once were.
    </p>
  </div>

<script>
  const button = document.getElementById('contactButton');
  const email = document.getElementById('email');

  button.addEventListener('click', (event) => {
    event.stopPropagation();
    email.classList.toggle('visible');
  });

  email.addEventListener('click', (event) => {
    event.stopPropagation();
  });

  document.addEventListener('click', () => {
    email.classList.remove('visible');
  });
</script>

</body>
</html>
