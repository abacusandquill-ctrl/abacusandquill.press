<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abacus & Quill</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #0e0e0e;
      color: #e8e0d0;
      font-family: Georgia, serif;
    }

    /* MOMENT ONE */

    .opening {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .container {
      max-width: 520px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: normal;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #b0a898;
    }

    /* THE SEAL */

    .contact {
      position: fixed;
      top: 2rem;
      right: 2rem;
      text-align: right;
      z-index: 10;
    }

    .contact button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .contact img {
      width: 64px;
      height: auto;
      display: block;
    }

    .email {
      display: none;
      margin-top: 0.7rem;
      font-size: 0.85rem;
    }

    .email.visible {
      display: block;
    }

    .email a {
      color: #b0a898;
      text-decoration: none;
    }

    /* MOMENT TWO */

    .sandolo {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 2rem;
    }

    .sandolo-cover {
      width: min(380px, 78vw);
      height: auto;
      display: block;

      opacity: 0;
      transform: translateY(35px);

      transition:
        opacity 1.4s ease,
        transform 1.4s ease;

      box-shadow:
        0 0 30px rgba(255, 235, 190, 0.10),
        0 0 80px rgba(255, 235, 190, 0.06);
    }

    .sandolo-cover.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .publication-date {
      margin-top: 2.5rem;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #b0a898;

      opacity: 0;
      transition: opacity 1.4s ease 0.4s;
    }

    .publication-date.revealed {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .contact {
        top: 1.25rem;
        right: 1.25rem;
      }

      .contact img {
        width: 54px;
      }

      .sandolo-cover {
        width: min(340px, 82vw);
      }
    }
  </style>
</head>

<body>

  <div class="contact">
    <button id="contactButton" aria-label="Abacus & Quill">
      <img src="aq-logo.png" alt="A&Q">
    </button>

    <div class="email" id="email">
      <a href="mailto:hello@abacusandquill.press">
        hello@abacusandquill.press
      </a>
    </div>
  </div>

  <section class="opening">
    <div class="container">
      <h1>Abacus &amp; Quill</h1>
      <p>
        New stories that feel remembered.<br>
        Beautiful books for curious young readers —<br>
        and for those who once were.
      </p>
    </div>
  </section>

  <section class="sandolo">
    <img
      src="sandolo-cover.png"
      alt="The Flying Sandolo"
      class="sandolo-cover"
      id="sandoloCover"
    >

    <div class="publication-date" id="publicationDate">
      Coming December 18, 2026
    </div>
  </section>

  <script>
    const button = document.getElementById('contactButton');
    const email = document.getElementById('email');

    button.addEventListener('click', (event) => {
      event.stopPropagation();
      email.classList.toggle('visible');
    });

    email.addEventListener('click', (event) => {
      event.stopPropagation();
    });

    document.addEventListener('click', () => {
      email.classList.remove('visible');
    });

    const cover = document.getElementById('sandoloCover');
    const publicationDate = document.getElementById('publicationDate');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          cover.classList.add('revealed');
          publicationDate.classList.add('revealed');
        }
      });
    }, {
      threshold: 0.25
    });

    observer.observe(cover);
  </script>

</body>
</html>
